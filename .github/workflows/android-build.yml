name: Android Build (APK & AAB) — Recharge Expres SaaS

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_flutter/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'White-Label Application Display Name'
        required: true
        default: 'Recharge Expres'
      package_id:
        description: 'Android Application ID / Package Name'
        required: true
        default: 'in.rechargeexpres.app'
      tenant_id:
        description: 'Backend Tenant Identifier'
        required: true
        default: 'tenant_master_platform'
      tenant_domain:
        description: 'Tenant Custom Domain (Host header)'
        required: true
        default: 'rechargeexpres.in'
      primary_color_hex:
        description: 'Brand Primary Hex Color (without #)'
        required: true
        default: '4F46E5'
      environment:
        description: 'Build Environment (production or development)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - development
      publish_release:
        description: 'Publish versioned GitHub Release (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release Version Tag (used only if publish_release is true)'
        required: false
        default: 'v1.0.0'

env:
  FLUTTER_WORKING_DIR: mobile_flutter
  APP_NAME: ${{ github.event.inputs.app_name || 'Recharge Expres' }}
  PACKAGE_ID: ${{ github.event.inputs.package_id || 'in.rechargeexpres.app' }}
  TENANT_ID: ${{ github.event.inputs.tenant_id || 'tenant_master_platform' }}
  TENANT_DOMAIN: ${{ github.event.inputs.tenant_domain || 'rechargeexpres.in' }}
  PRIMARY_COLOR_HEX: ${{ github.event.inputs.primary_color_hex || '4F46E5' }}
  APP_ENV: ${{ github.event.inputs.environment || 'production' }}

jobs:
  build-android:
    name: Build White-Label Android APK & AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FLUTTER_WORKING_DIR }}

    steps:
      - name: 1. Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: 2. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Scaffold Platform Runner & Preserve White-Label Android Config
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Backing up white-label Dart source, tests, build.gradle, and AndroidManifest.xml before scaffolding..."
            mkdir -p /tmp/rx_android_backup
            cp -r lib /tmp/rx_android_backup/lib
            cp -r test /tmp/rx_android_backup/test
            cp pubspec.yaml /tmp/rx_android_backup/pubspec.yaml
            cp analysis_options.yaml /tmp/rx_android_backup/analysis_options.yaml
            cp android/app/build.gradle /tmp/rx_android_backup/build.gradle
            cp android/app/src/main/AndroidManifest.xml /tmp/rx_android_backup/AndroidManifest.xml
            flutter create --org in.rechargeexpres --project-name recharge_expres_mobile --platforms=android,ios .
            rm -f android/app/build.gradle.kts
            cp -r /tmp/rx_android_backup/lib/* lib/
            cp -r /tmp/rx_android_backup/test/* test/
            cp /tmp/rx_android_backup/pubspec.yaml pubspec.yaml
            cp /tmp/rx_android_backup/analysis_options.yaml analysis_options.yaml
            cp /tmp/rx_android_backup/build.gradle android/app/build.gradle
            cp /tmp/rx_android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            chmod +x android/gradlew
          fi

      - name: 5. Configure Android Release Signing (GitHub Secrets Check)
        id: signing_check
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Production Android signing secrets detected. Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "signed=true" >> $GITHUB_OUTPUT
            echo "SIGNING_STATUS=PRODUCTION_SIGNED_RELEASE" >> $GITHUB_ENV
          else
            echo "WARNING: Android signing secrets (ANDROID_KEYSTORE_BASE64, etc.) are NOT configured."
            echo "Proceeding with UNSIGNED / DEBUG-KEY TESTING build. This artifact is for testing only and NOT Play Store ready."
            echo "signed=false" >> $GITHUB_OUTPUT
            echo "SIGNING_STATUS=UNSIGNED_TESTING_BUILD_NOT_PLAY_STORE_READY" >> $GITHUB_ENV
          fi

      - name: 6. Install Flutter Dependencies
        run: flutter pub get

      - name: 7. Run Flutter Static Analyzer
        run: flutter analyze

      - name: 8. Run Automated Flutter Tests
        run: flutter test

      - name: 9. Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=APP_NAME="${{ env.APP_NAME }}" \
            --dart-define=PACKAGE_ID="${{ env.PACKAGE_ID }}" \
            --dart-define=TENANT_ID="${{ env.TENANT_ID }}" \
            --dart-define=TENANT_DOMAIN="${{ env.TENANT_DOMAIN }}" \
            --dart-define=PRIMARY_COLOR_HEX="${{ env.PRIMARY_COLOR_HEX }}" \
            --dart-define=APP_ENV="${{ env.APP_ENV }}"

      - name: 10. Build Release App Bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=APP_NAME="${{ env.APP_NAME }}" \
            --dart-define=PACKAGE_ID="${{ env.PACKAGE_ID }}" \
            --dart-define=TENANT_ID="${{ env.TENANT_ID }}" \
            --dart-define=TENANT_DOMAIN="${{ env.TENANT_DOMAIN }}" \
            --dart-define=PRIMARY_COLOR_HEX="${{ env.PRIMARY_COLOR_HEX }}" \
            --dart-define=APP_ENV="${{ env.APP_ENV }}"

      - name: 11. Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TENANT_ID }}-android-apk-${{ env.SIGNING_STATUS }}
          path: ${{ env.FLUTTER_WORKING_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 12. Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TENANT_ID }}-android-aab-${{ env.SIGNING_STATUS }}
          path: ${{ env.FLUTTER_WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: 13. Display Build Summary & Signing Verdict
        run: |
          echo "### Recharge Expres Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Application Name**: ${{ env.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID**: \`${{ env.PACKAGE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tenant ID**: \`${{ env.TENANT_ID }}\` (\`${{ env.TENANT_DOMAIN }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ env.APP_ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signing Status**: \`${{ env.SIGNING_STATUS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Output**: \`build/app/outputs/flutter-apk/app-release.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB Output**: \`build/app/outputs/bundle/release/app-release.aab\`" >> $GITHUB_STEP_SUMMARY

      - name: 14. Optional Versioned GitHub Release (When Authorized)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          name: "${{ env.APP_NAME }} ${{ github.event.inputs.release_tag || 'v1.0.0' }} (${{ env.SIGNING_STATUS }})"
          body: |
            Automated White-Label Build for **${{ env.APP_NAME }}** (`${{ env.PACKAGE_ID }}`).
            - Tenant Domain: `${{ env.TENANT_DOMAIN }}`
            - Signing Verdict: `${{ env.SIGNING_STATUS }}`
          files: |
            ${{ env.FLUTTER_WORKING_DIR }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ env.FLUTTER_WORKING_DIR }}/build/app/outputs/bundle/release/app-release.aab
